          },
        }; }

        function getCabinetIdentity(game, index) {
          const table = getCabinetIdentityTable();
          const fallbacks = Object.values(table);
          return table[game.name] || fallbacks[index % fallbacks.length];
        }

        function drawCabinetMotif(ctx, motif, cx, cy, size, ink, accent) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.strokeStyle = ink;
          ctx.fillStyle = ink;
          ctx.lineWidth = size * 0.07;
          ctx.lineCap = 'round';
          if (motif === 'checker') {
            const cell = size / 4;
            for (let r = 0; r < 3; r += 1) {
              for (let c = 0; c < 8; c += 1) {
                if ((r + c) % 2 === 0) ctx.fillRect(-cell * 4 + c * cell, -cell * 1.5 + r * cell, cell, cell);
              }
            }
          } else if (motif === 'shield') {
            ctx.beginPath();
            ctx.moveTo(-size * 0.4, -size * 0.45);
            ctx.lineTo(size * 0.4, -size * 0.45);
            ctx.quadraticCurveTo(size * 0.42, size * 0.25, 0, size * 0.5);
            ctx.quadraticCurveTo(-size * 0.42, size * 0.25, -size * 0.4, -size * 0.45);
            ctx.fillStyle = accent;
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.3);
            ctx.lineTo(0, size * 0.3);
            ctx.moveTo(-size * 0.22, -size * 0.08);
            ctx.lineTo(size * 0.22, -size * 0.08);
            ctx.stroke();
          } else if (motif === 'swords') {
            [-1, 1].forEach((dir) => {
              ctx.save();
              ctx.rotate(dir * Math.PI / 4);
              ctx.fillRect(-size * 0.04, -size * 0.55, size * 0.08, size * 0.8);
              ctx.fillStyle = accent;
              ctx.fillRect(-size * 0.2, size * 0.25, size * 0.4, size * 0.07);
              ctx.fillRect(-size * 0.05, size * 0.32, size * 0.1, size * 0.2);
              ctx.restore();
            });
          } else if (motif === 'rebound') {
            ctx.beginPath();
            ctx.moveTo(-size * 0.7, size * 0.35);
            ctx.lineTo(0, -size * 0.35);
            ctx.lineTo(size * 0.42, size * 0.08);
            ctx.stroke();
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.arc(size * 0.55, size * 0.22, size * 0.2, 0, Math.PI * 2);
            ctx.fill();
          } else if (motif === 'wave') {
            ctx.beginPath();
            for (let i = 0; i <= 60; i += 1) {
              const x = -size * 0.9 + (i / 60) * size * 1.8;
              const y = Math.sin(i * 0.45) * size * 0.22 * Math.exp(-Math.abs(i - 30) / 22);
              if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
          } else if (motif === 'moon') {
            ctx.fillStyle = accent;
            ctx.beginPath();
            ctx.arc(0, -size * 0.1, size * 0.34, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(size * 0.14, -size * 0.18, size * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = ink;
            for (let i = 0; i < 4; i += 1) ctx.fillRect(-size * 0.8 + i * size * 0.45, size * 0.42, size * 0.25, size * 0.05);
          }
          ctx.restore();
        }

        function createMarqueeTexture(game, id) {
          return makeCanvasTexture(512, 112, (ctx, w, h) => {
            ctx.fillStyle = id.ground;
            ctx.fillRect(0, 0, w, h);
            const shade = ctx.createLinearGradient(0, 0, 0, h);
            shade.addColorStop(0, 'rgba(255,240,210,0.16)');
            shade.addColorStop(1, 'rgba(0,0,0,0.28)');
            ctx.fillStyle = shade;
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = id.ink;
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 2;
            ctx.strokeRect(8, 8, w - 16, h - 16);
            ctx.globalAlpha = 1;
            drawCabinetMotif(ctx, id.motif, 58, h / 2, 64, id.ink, `#${id.accent.toString(16).padStart(6, '0')}`);
            ctx.fillStyle = id.ink;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const family = id.serif ? 'Georgia, "Times New Roman", serif' : 'Rajdhani, "Arial Narrow", sans-serif';
            let fontSize = 62;
            ctx.font = `${id.font} ${fontSize}px ${family}`;
            while (ctx.measureText(game.name).width > w - 170 && fontSize > 30) {
              fontSize -= 2;
              ctx.font = `${id.font} ${fontSize}px ${family}`;
            }
            ctx.fillText(game.name, w / 2 + 34, h / 2 - 8);
            ctx.font = `600 16px Rajdhani, sans-serif`;
            ctx.globalAlpha = 0.78;
            ctx.fillText(id.tagline.split('').join(' '), w / 2 + 34, h - 22);
            ctx.globalAlpha = 1;
          });
        }

        function createSideArtTexture(game, id) {
          return makeCanvasTexture(256, 384, (ctx, w, h) => {
            ctx.clearRect(0, 0, w, h);
            const accentCss = `#${id.accent.toString(16).padStart(6, '0')}`;
            ctx.globalAlpha = 0.9;
            drawCabinetMotif(ctx, id.motif, w / 2, h * 0.3, 150, id.ink === '#2e2013' ? '#e6d3a8' : id.ink, accentCss);
            ctx.globalAlpha = 1;
            ctx.fillStyle = id.ink === '#2e2013' ? '#e6d3a8' : id.ink;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const family = id.serif ? 'Georgia, serif' : 'Rajdhani, "Arial Narrow", sans-serif';
            let fontSize = 54;
            ctx.font = `${id.font} ${fontSize}px ${family}`;
            while (ctx.measureText(game.name).width > w - 30 && fontSize > 26) {
              fontSize -= 2;
              ctx.font = `${id.font} ${fontSize}px ${family}`;
            }
            ctx.fillText(game.name, w / 2, h * 0.64);
            ctx.fillStyle = accentCss;
            ctx.fillRect(w * 0.2, h * 0.72, w * 0.6, 4);
          });
        }

        function buildHallCabinet(cabinet, game, id) {
          const dormant = !!game.comingSoon;
          const bodyMaterial = new THREE.MeshStandardMaterial({ color: id.body, roughness: 0.48, metalness: 0.05 });
          const sideMaterial = new THREE.MeshStandardMaterial({ color: 0x3a2416, roughness: 0.6, metalness: 0.02 });
          const trimMaterial = new THREE.MeshStandardMaterial({ color: id.trim, roughness: 0.38, metalness: 0.65 });
          const darkMaterial = new THREE.MeshStandardMaterial({ color: 0x14100d, roughness: 0.7 });

          // Side profile (z forward, y up): kick, control deck lip, upright screen face,
          // marquee hood, sloped roof.
          const profile = new THREE.Shape();
          [[-0.95, 0], [1.1, 0], [1.1, 0.95], [1.55, 1.12], [1.55, 1.28], [1.08, 1.46],
            [1.08, 3.2], [1.42, 3.3], [1.42, 3.92], [-0.95, 4.02]].forEach(([z, y], i) => {
            if (i === 0) profile.moveTo(z, y); else profile.lineTo(z, y);
          });
          const extrude = (depth) => new THREE.ExtrudeGeometry(profile, { depth, bevelEnabled: false });

          const body = new THREE.Mesh(extrude(2.36), bodyMaterial);
          body.rotation.y = -Math.PI / 2;
          body.position.x = 1.18;
          cabinet.add(body);

          [-1, 1].forEach((sideSign) => {
            const panel = new THREE.Mesh(extrude(0.07), sideMaterial);
            panel.rotation.y = -Math.PI / 2;
            panel.position.x = sideSign > 0 ? 1.25 : -1.18;
            cabinet.add(panel);

            const art = new THREE.Mesh(
              new THREE.PlaneGeometry(1.5, 2.25),
              new THREE.MeshStandardMaterial({ map: createSideArtTexture(game, id), transparent: true, roughness: 0.55 })
            );
            art.rotation.y = sideSign * Math.PI / 2;
            art.position.set(sideSign * 1.256, 2.35, 0.2);
            cabinet.add(art);

            // Brass T-molding along the upright edge.
            const molding = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.74, 0.03), trimMaterial);
            molding.position.set(sideSign * 1.22, 2.33, 1.1);
            cabinet.add(molding);
          });

          // Marquee: backlit printed panel, dimmed when the cabinet is dormant.
          const marqueeMaterial = new THREE.MeshBasicMaterial({
            map: createMarqueeTexture(game, id),
            color: dormant ? 0x6f665c : 0xe8ddcb,
            toneMapped: false,
          });
          const marquee = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 0.5), marqueeMaterial);
          marquee.position.set(0, 3.61, 1.425);
          marquee.name = 'marquee';
          cabinet.add(marquee);
          const marqueeFrame = new THREE.Mesh(new THREE.BoxGeometry(2.42, 0.05, 0.08), trimMaterial);
          marqueeFrame.position.set(0, 3.33, 1.42);
          cabinet.add(marqueeFrame);
          const marqueeFrameTop = marqueeFrame.clone();
          marqueeFrameTop.position.y = 3.89;
          cabinet.add(marqueeFrameTop);

          // Screen recess and brass bezel.
          const recess = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.62), darkMaterial);
          recess.position.set(0, 2.45, 1.085);
          cabinet.add(recess);
          addCabinetScreen(cabinet, game, {
            width: 1.84, height: 1.34, depth: 0.1, x: 0, y: 2.45, z: 1.1,
            frameColor: 0x07080a, emissiveColor: id.accent, emissiveIntensity: 0.15,
            planeWidth: 1.76, planeHeight: 1.26, planeOffset: 0.012,
          });
          [[0, 3.14, 2.0, 0.04], [0, 1.76, 2.0, 0.04]].forEach(([x, y, w, h]) => {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), trimMaterial);
            bar.position.set(x, y, 1.12);
            cabinet.add(bar);
          });
          [-1, 1].forEach((s) => {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(0.04, 1.42, 0.04), trimMaterial);
            bar.position.set(s * 0.98, 2.45, 1.12);
            cabinet.add(bar);
          });

          // Coming-soon cabinets get a timber shutter band across the lower screen.
          if (dormant) {
            const band = new THREE.Mesh(
              new THREE.PlaneGeometry(1.76, 0.26),
              new THREE.MeshBasicMaterial({
                map: makeCanvasTexture(512, 76, (ctx, w, h) => {
                  ctx.fillStyle = '#2a1a10';
                  ctx.fillRect(0, 0, w, h);
                  ctx.fillStyle = '#e9d7b0';
                  ctx.font = '700 40px Rajdhani, sans-serif';
                  ctx.textAlign = 'center';
                  ctx.textBaseline = 'middle';
                  ctx.fillText('C O M I N G   S O O N', w / 2, h / 2 + 2);
                }),
                toneMapped: false,
              })
            );
            band.position.set(0, 2.0, 1.17);
            cabinet.add(band);
          }

          addCabinetActionPanel(cabinet, { panelY: 1.6, panelZ: 1.22, panelWidth: 1.9 });

          // Control deck hardware sits on the sloped deck (1.55,1.28)->(1.08,1.46).
          const deckSlope = Math.atan2(1.46 - 1.28, 1.55 - 1.08);
          const deck = new THREE.Group();
          deck.position.set(0, 1.37, 1.32);
          deck.rotation.x = -deckSlope;
          cabinet.add(deck);
          const deckPlate = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.02, 0.5), darkMaterial);
          deck.add(deckPlate);
          const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.2, 8), trimMaterial);
          stick.position.set(-0.6, 0.1, 0);
          deck.add(stick);
          const ball = new THREE.Mesh(
            new THREE.SphereGeometry(0.06, 12, 10),
            new THREE.MeshStandardMaterial({ color: id.accent, roughness: 0.35 })
          );
          ball.position.set(-0.6, 0.22, 0);
          deck.add(ball);
          const buttonMaterial = new THREE.MeshStandardMaterial({ color: id.accent, roughness: 0.35, metalness: 0.1 });
          const buttonGeometry = new THREE.CylinderGeometry(0.055, 0.055, 0.04, 14);
          for (let b = 0; b < 4; b += 1) {
            const button = new THREE.Mesh(buttonGeometry, b % 2 ? trimMaterial : buttonMaterial);
            button.position.set(0.05 + b * 0.2, 0.03, (b % 2) * 0.08 - 0.04);
            deck.add(button);
          }

          // Coin door with two warm-lit slots.
          const coinDoor = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.5, 0.03), trimMaterial);
          coinDoor.position.set(0, 0.55, 1.115);
          cabinet.add(coinDoor);
          const slotMaterial = new THREE.MeshBasicMaterial({ color: dormant ? 0x3a2a1c : 0xd9894a, toneMapped: false });
          [-0.12, 0.12].forEach((x) => {
            const slot = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.12), slotMaterial);
            slot.position.set(x, 0.62, 1.132);
            cabinet.add(slot);
          });
          const kick = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.12, 0.04), darkMaterial);
          kick.position.set(0, 0.06, 1.12);
          cabinet.add(kick);

          cabinet.userData.accentColor = new THREE.Color(id.accent);
        }

        function getLookAnchorTarget(target) {
          if (!target || !target.userData) return target;
          if (['cabinet-play', 'cabinet-guide', 'cabinet-back', 'cabinet-coming-soon'].includes(target.userData.action)) {
            return target.userData.cabinet || target;
          }
          if (target.userData.action === 'codex-open') {
            return target.userData.pedestal || target;
          }
          return target;
        }
        let lastFrameTime = performance.now();
        let lastRenderedAt = 0;
        let animationFrameId = 0;

        function animate() {
          animationFrameId = requestAnimationFrame(animate);
          const now = performance.now();
          if (!engineFailed && renderer.getContext().isContextLost()) {
            stopTouchInput();
            engineFailed = true;
            maybeToggleLayout();
          }
          if (document.hidden || layoutMode === 'directory' || engineFailed) {
            lastFrameTime = now;
            return;
          }
          if (usesTouchControls() && now - lastRenderedAt < 1000 / 30) return;
          lastRenderedAt = now;
          const deltaSeconds = Math.min((now - lastFrameTime) / 1000, 0.1);
          lastFrameTime = now;

          if (introClockStart === null) {
            introClockStart = now;
          }

          let introActive = false;
          introAnimations.forEach((animation) => {
            if (animation.done) return;
            const elapsed = now - introClockStart - animation.delay;
            if (elapsed < 0) {
              introActive = true;
              return;
            }
            const progress = Math.min(1, elapsed / animation.duration);
            const eased = easeOutCubic(progress);
            if (typeof animation.apply === 'function') {
              animation.apply(eased);
            }
            if (progress >= 1) {
              animation.done = true;
              if (typeof animation.finalize === 'function') {
                animation.finalize();
              }
            } else {
              introActive = true;
            }
          });

          if (!introActive && !introDone) {
            introDone = true;
          }
          if (!cabinetIntroDone && now - introClockStart >= cabinetIntroSettleMs) {
            cabinetIntroDone = true;
          }

          const launching = !!launchSequence;
          const cameraLocked = approachingCabinet || activeCabinet || launching;
          if (launching) {
            launchSequence.elapsed = Math.min(
              CABINET_LAUNCH_DURATION_SECONDS,
              launchSequence.elapsed + deltaSeconds
            );
            const raw = launchSequence.elapsed / CABINET_LAUNCH_DURATION_SECONDS;
            const eased = 1 - Math.pow(1 - raw, 3);
            rigGoal.lerpVectors(launchSequence.from, launchSequence.to, eased);
            focusRigTarget.copy(launchSequence.to);
            if (raw >= 1) {
              const launchUrl = launchSequence.url;
              launchSequence = null;
              window.location.href = launchUrl;
            }
          } else if (!cameraLocked) {
            const damping = Math.exp(-2.8 * deltaSeconds);
            scrollVelocity *= damping;
            if (Math.abs(scrollVelocity) < 0.00001) {
              scrollVelocity = 0;
            }
            targetZ += (scrollVelocity + touchMove * 9) * deltaSeconds;
            if (targetZ < minZ) {
              targetZ = minZ;
              scrollVelocity = Math.max(0, scrollVelocity);
            } else if (targetZ > maxZ) {
              targetZ = maxZ;
              scrollVelocity = Math.min(0, scrollVelocity);
            }
            rigGoal.set(0, CAMERA_START_POSITION.y, targetZ);
          } else {
            rigGoal.copy(focusRigTarget);
            rigGoal.y = CAMERA_START_POSITION.y;
          }
          cameraRig.position.lerp(rigGoal, 1 - Math.exp(-(usesTouchControls() ? 7 : 3.2) * deltaSeconds));
          cameraRig.position.y = CAMERA_START_POSITION.y;
          if (!cameraLocked) {
            walkwayReturnPosition.set(0, CAMERA_START_POSITION.y, cameraRig.position.z);
          }

          if (approachingCabinet) {
            const alignmentDistance = cameraRig.position.distanceTo(focusRigTarget);
            if (alignmentDistance < APPROACH_ALIGNMENT_EPSILON) {
              activeCabinet = approachingCabinet;
              hoverCabinet = approachingCabinet;
              approachingCabinet = null;
            }
          }

          if (launchSequence) {
            desiredLookTarget.copy(launchSequence.cabinet.position).setY(DEFAULT_LOOK_TARGET.y);
          } else {
            const lookTargetCabinet = getLookAnchorTarget(activeCabinet ?? hoverCabinet);
            if (lookTargetCabinet) {
              if (lookTargetCabinet.userData && lookTargetCabinet.userData.lookPosition) {
                desiredLookTarget.copy(lookTargetCabinet.userData.lookPosition);
              } else {
                lookTargetCabinet.getWorldPosition(desiredLookTarget);
                desiredLookTarget.y = DEFAULT_LOOK_TARGET.y;
              }
            } else {
              desiredLookTarget.set(Math.sin(touchYaw) * 10, DEFAULT_LOOK_TARGET.y + Math.sin(touchPitch) * 10,
                cameraRig.position.z - Math.cos(touchYaw) * 10);
            }
          }
          const lookLerpSpeed = activeCabinet ? 0.2 : 0.08;
          lookTarget.lerp(desiredLookTarget, lookLerpSpeed);

          if (hoverLockState === 'panning' && hoverCabinet) {
            const lookDelta = lookTarget.distanceTo(desiredLookTarget);
            if (lookDelta < LOOK_TARGET_SETTLED_EPSILON) {
              hoverLockState = 'hold';
              hoverLockUntil = now + getHoverHoldDurationMs(hoverCabinet);
            }
          } else if (hoverLockState === 'hold' && now >= hoverLockUntil) {
            hoverLockState = 'idle';
            applyHoverSelection(pendingHoverCabinet);
          }

          camera.lookAt(lookTarget);

          updateExitDoorOpen(deltaSeconds, now);
          updateCabinetEmissive(deltaSeconds, now);
          updateDeepField(deltaSeconds, now);
          syncCabinetActionButtons();
          syncInspectControls();

          renderer.render(scene, camera);
        }

        animationFrameId = requestAnimationFrame(animate);
        const onResize = () => {
          stopTouchInput();
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.fov = usesTouchControls() && camera.aspect < 1 ? 80 : 60;
          camera.updateProjectionMatrix();
          updateRenderSize();
        };
        onResize();
        syncInspectControls();

        const onPageShow = (event) => {
          if (event.persisted) {
            applyReturnStateIfPresent();
          }
        };

        window.addEventListener('resize', onResize);
        window.addEventListener('pageshow', onPageShow);

        return () => {
          touchBindings.forEach((remove) => remove());
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('wheel', onWheel);
          window.removeEventListener('keydown', onKeyDown);
          window.removeEventListener('resize', onResize);
          window.removeEventListener('pageshow', onPageShow);
          renderer.domElement.removeEventListener('pointermove', onPointerMove);
          renderer.domElement.removeEventListener('pointerleave', onPointerLeave);
          renderer.domElement.removeEventListener('click', onRendererClick);
          renderer.domElement.style.cursor = 'default';
          if (renderer.domElement.parentElement === sceneContainer) {
            sceneContainer.removeChild(renderer.domElement);
          }

          scene.traverse((child) => {
            if (child.geometry && typeof child.geometry.dispose === 'function') {
              child.geometry.dispose();
            }

            const materials = Array.isArray(child.material)
              ? child.material
              : child.material
              ? [child.material]
              : [];

            materials.forEach((material) => {
              if (!material) return;
              if (material.map && typeof material.map.dispose === 'function') {
                material.map.dispose();
              }
              if (typeof material.dispose === 'function') {
                material.dispose();
              }
            });
          });

          renderer.dispose();
        };
      }
    </script>
  </body>
</html>
